<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Immersive India</title>

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/gesture-detector@4.0.5/dist/gesture-detector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/gesture-handler@4.0.5/dist/gesture-handler.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #title {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        #main-buttons {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: min(82%, 340px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .main-button {
            width: 100%;
            padding: 13px 18px;
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 30px;
            background: rgba(0,0,0,0.52);
            color: white;
            font-size: 14px;
            letter-spacing: 0.5px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .main-button:active {
            transform: scale(0.97);
        }

        #social-links {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 22px;
            pointer-events: auto;
        }

        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .social-button {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.75);
            background: rgba(0,0,0,0.58);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .social-label {
            margin-top: 5px;
            color: white;
            font-size: 9px;
            text-shadow: 0 1px 5px black;
        }

        .panel {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(82%, 350px);
            padding: 24px;
            border-radius: 20px;
            background: rgba(0,0,0,0.78);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .panel h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .close-button {
            margin-top: 18px;
            padding: 9px 20px;
            border: 1px solid white;
            border-radius: 20px;
            background: transparent;
            color: white;
        }

        #musicButton {
            position: absolute;
            top: 20px;
            right: 18px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.55);
            color: white;
            font-size: 16px;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <div id="ui">

        <div id="title">IMMERSIVE INDIA</div>

        <button id="musicButton">♫</button>

        <div id="main-buttons">

            <button class="main-button" onclick="openPanel('companyPanel')">
                Learn About Company
            </button>

            <button class="main-button" onclick="openPanel('museumPanel')">
                Explore Museums
            </button>

            <button class="main-button" onclick="openPanel('experiencePanel')">
                About Experience
            </button>

        </div>

        <div id="social-links">

            <div class="social-item">
                <a
                    class="social-button"
                    href="www.linkedin.com/in/manvi-82996a312"
                    target="_blank"
                    rel="noopener">
                    in
                </a>
                <div class="social-label">LinkedIn</div>
            </div>

            <div class="social-item">
                <a
                    class="social-button"
                    href="https://memanviportfolio.framer.website/"
                    target="_blank"
                    rel="noopener">
                    ↗
                </a>
                <div class="social-label">Portfolio</div>
            </div>

            <div class="social-item">
                <a
                    class="social-button"
                    href="mailto:manvi01.k@gmail.com">
                    ✉
                </a>
                <div class="social-label">Mail</div>
            </div>

        </div>

        <div id="companyPanel" class="panel">
            <h2>Immersive India</h2>
            <p>Discover India through interactive digital experiences.</p>
            <button class="close-button" onclick="closePanels()">Close</button>
        </div>

        <div id="museumPanel" class="panel">
            <h2>Explore Museums</h2>
            <p>Step into stories, objects and cultures through immersive technology.</p>
            <button class="close-button" onclick="closePanels()">Close</button>
        </div>

        <div id="experiencePanel" class="panel">
            <h2>About Experience</h2>
            <p>Scan the visiting card and enter an interactive world of India.</p>
            <button class="close-button" onclick="closePanels()">Close</button>
        </div>

    </div>


    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        gesture-detector
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <a-marker
            id="markerA"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;">

            <!-- WELCOME TEXT INSIDE AR SPACE -->
            <a-text
                value="WELCOME!"
                position="0 1.2 0"
                rotation="-90 0 0"
                align="center"
                color="#FFFFFF"
                width="4"
                class="clickable">
            </a-text>

            <!-- NEW LIGHTWEIGHT PORTAL MODEL -->
            <a-entity
                gltf-model="url(assets/portal.glb)"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                class="clickable"
                gesture-handler>
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>


    <audio
        id="backgroundMusic"
        src="assets/delosound-mystery-mystical-music-442826.mp3"
        loop
        preload="auto">
    </audio>


    <script>
        function openPanel(id) {
            document.getElementById(id).style.display = "block";
        }

        function closePanels() {
            document.querySelectorAll(".panel").forEach(function(panel) {
                panel.style.display = "none";
            });
        }

        const music = document.getElementById("backgroundMusic");
        const musicButton = document.getElementById("musicButton");

        musicButton.addEventListener("click", function() {
            if (music.paused) {
                music.play()
                    .then(function() {
                        musicButton.textContent = "🔊";
                    })
                    .catch(function(error) {
                        console.log("Music could not start:", error);
                    });
            } else {
                music.pause();
                musicButton.textContent = "♫";
            }
        });

        document.addEventListener("click", function() {
            if (music.paused) {
                music.play()
                    .then(function() {
                        musicButton.textContent = "🔊";
                    })
                    .catch(function() {});
            }
        }, { once: true });
    </script>

</body>
</html>
